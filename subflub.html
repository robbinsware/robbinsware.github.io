<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FedEx Pilot SUB Decision Navigator - CBA Sec 4 & 25</title>
  <style>
    :root {
      --fdx-purple: #4D148C;
      --fdx-orange: #FF6600;
      --dark-bg: #0b0e14;
      --card-bg: #151921;
      --panel-bg: #1c222d;
      --border: #2d3544;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --green: #238636;
      --green-bright: #3fb950;
      --blue: #58a6ff;
      --red: #da3633;
      --yellow: #d29922;
      --purple-light: #bc8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--dark-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      line-height: 1.45;
    }
    .container { max-width: 1480px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--fdx-purple);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    header h1 { font-size: 1.5rem; color: #fff; }
    header h1 span { color: var(--fdx-orange); }
    .badge-path {
      background: rgba(255, 102, 0, 0.15);
      border: 1px solid var(--fdx-orange);
      color: var(--fdx-orange);
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-family: monospace;
      font-size: 0.95rem;
    }
    .main-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      color: var(--blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; font-weight: 700; }
    input, select {
      width: 100%;
      background: var(--dark-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 7px 10px;
      border-radius: 4px;
      font-size: 0.86rem;
      font-family: monospace;
      margin-bottom: 10px;
    }
    input:focus, select:focus { outline: none; border-color: var(--blue); }
    .btn-action-primary {
      background: var(--fdx-purple);
      border: 1px solid #7c3aed;
      color: #fff;
      padding: 9px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-action-primary:hover { background: #5c18a8; }

    /* STANDARDIZED SCOREBOARD (6 COLUMNS) */
    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 8px;
      text-align: center;
    }
    .metric-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; height: 28px; display: flex; align-items: center; justify-content: center; }
    .metric-val { font-size: 1.25rem; font-family: monospace; font-weight: bold; margin-top: 2px; }
    .metric-sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }

    /* CALLOUT BANNERS */
    .banner-deadline {
      background: rgba(210, 153, 34, 0.12);
      border-left: 3px solid var(--yellow);
      color: #e3b341;
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner-recom {
      background: rgba(35, 134, 54, 0.15);
      border-left: 3px solid var(--green-bright);
      color: var(--green-bright);
      font-size: 0.8rem;
      padding: 7px 12px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 14px;
      font-weight: 600;
    }

    /* STEP CARDS */
    .step-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .step-card.active { border-left: 4px solid var(--fdx-orange); background: #18202c; }
    .step-card.completed { border-left: 4px solid var(--green); opacity: 0.92; }
    .step-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .step-tag { font-family: monospace; font-weight: bold; font-size: 0.82rem; color: var(--fdx-orange); }
    .step-time { font-family: monospace; font-size: 0.78rem; color: var(--blue); background: rgba(88, 166, 255, 0.1); padding: 2px 8px; border-radius: 4px; }
    .step-title { font-size: 0.98rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .step-text { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 14px; }

    /* CHOICE TILES */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }
    .choice-tile {
      background: var(--dark-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.15s;
    }
    .choice-tile:hover { border-color: var(--blue); transform: translateY(-2px); }
    .choice-tile.recommended-tile { border-color: var(--green-bright); background: #0f1c19; }
    .badge-rec {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .choice-code { font-family: monospace; font-weight: bold; color: var(--yellow); font-size: 0.82rem; margin-bottom: 2px; }
    .choice-heading { font-weight: 700; font-size: 0.92rem; color: #fff; margin-bottom: 4px; }
    .choice-detail { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; }

    /* STANDARDIZED METRIC BOX PER TILE */
    .tile-stats-block {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 4px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.77rem;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .tile-stats-block span { color: var(--text-muted); }
    .tile-stats-block strong { color: #fff; }

    /* PROS & CONS */
    .pro-con-section {
      font-size: 0.76rem;
      line-height: 1.4;
      margin-bottom: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 8px;
    }
    .pro-block { color: #7ee787; margin-bottom: 6px; }
    .pro-block strong { color: #56d364; text-transform: uppercase; font-size: 0.7rem; display: block; margin-bottom: 2px; }
    .con-block { color: #f85149; }
    .con-block strong { color: #e5534b; text-transform: uppercase; font-size: 0.7rem; display: block; margin-bottom: 2px; }

    /* INLINE INPUT FORM INSIDE TILE A-B */
    .inline-form {
      background: #1c222d;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px;
      margin: 10px 0;
    }
    .inline-form h3 { font-size: 0.82rem; color: var(--blue); margin-bottom: 8px; text-transform: uppercase; }
    .inline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .choice-actions { display: flex; gap: 8px; margin-top: auto; }
    .btn-choose {
      flex: 1;
      background: var(--fdx-purple);
      border: 1px solid #7c3aed;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }
    .btn-choose:hover { background: #5c18a8; }
    .btn-decline {
      flex: 1;
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--yellow);
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }
    .btn-decline:hover { background: #30363d; color: #fff; }
    .portal-link {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--blue);
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .portal-link:hover { background: #30363d; color: #fff; }
    .cite-text {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-style: italic;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 12px;
      border-left: 2px solid var(--blue);
    }
    .btn-restart {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
    }
    .btn-restart:hover { color: #fff; border-color: var(--text-muted); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>SUB Decision Navigator <span>// FedEx CBA Sec 4 & 25</span></h1>
      <div style="font-size: 0.82rem; color: var(--text-muted);">Standardized Accounting • Inline Live Offer & Decline • Multi-Trip Residual Cycling</div>
    </div>
    <div class="badge-path" id="pathDisplay">[PATH: ROOT]</div>
  </header>

  <div class="main-layout">
    <!-- LEFT SIDEBAR: INQUIRY & PERSISTENT DEFAULTS -->
    <div>
      <div class="card">
        <h2>1. Substitution Inquiry Data</h2>
        <label for="pilotName">Pilot / Seat</label>
        <input type="text" id="pilotName" value="JOHNATHAN ROBBINS (3749607) // MEM B767 FO">

        <label for="guarInput">Original Trip Guarantee (CH)</label>
        <input type="text" id="guarInput" value="6:38">

        <label for="winStart">Sub Window Start (Zulu)</label>
        <input type="text" id="winStart" value="17OCT26 0336z">

        <label for="winEnd">Sub Window End (Zulu)</label>
        <input type="text" id="winEnd" value="18OCT26 0742z">

        <label for="iapEnd">IAP End (Zulu)</label>
        <input type="text" id="iapEnd" value="17OCT26 1136z">

        <label for="winType">Window Duration Classification</label>
        <select id="winType" onchange="initNavigator()">
          <option value="short">Short SUB Window (&lt;72h // e.g. 28:06h)</option>
          <option value="long">Long SUB Window (&gt;72h // Multi-Day Cycle)</option>
        </select>

        <label for="origDayFlight">Original Flight Classification</label>
        <select id="origDayFlight">
          <option value="day">Day Trip (Sec 25.H.5.b Protection Active)</option>
          <option value="night">Night / Critical Trip</option>
        </select>
      </div>

      <div class="card" style="border-left: 3px solid var(--yellow);">
        <h2>2. Baseline Default Trip Input</h2>
        <div style="font-size: 0.74rem; color: var(--text-muted); margin-bottom: 8px;">
          Initial values that automatically populate inside live offer tiles.
        </div>
        <label>Default Pairing Code</label>
        <input type="text" id="defTripCode" value="DEFAULT 24H SUB">

        <label>Credit Hours (CH)</label>
        <input type="text" id="defTripCH" value="6:00">

        <label>Schedule Window</label>
        <input type="text" id="defTripSpan" value="0100L - 2300L (24h period)">

        <button class="btn-action-primary" onclick="initNavigator()">Reset to Root State</button>
      </div>
    </div>

    <!-- RIGHT MAIN WORKSPACE -->
    <div>
      <!-- 6-METRIC MASTER SCOREBOARD -->
      <div class="scoreboard-grid" id="topMetrics">
        <!-- Rendered by JS -->
      </div>

      <!-- STRATEGY BANNER -->
      <div class="banner-recom" id="recomBanner">
        <!-- Injected by JS -->
      </div>

      <!-- DYNAMIC DECISION CONTAINER -->
      <div id="treeContainer">
        <!-- Stages injected dynamically -->
      </div>
    </div>
  </div>
</div>

<script>
let state = {
  pathCode: "ROOT",
  origGuarDec: 6.633, // 6:38
  currentPay: 6.633,
  payNote: "Protected @ 100%",
  subRemaining: 6.633,
  subRemNote: "Full Balance Remaining",
  m3Clawback: 0.0,
  m3Note: "No Clawback Triggered",
  otpBank: 0.0,
  otpBankNote: "125% PMU Rate",
  makeupBank: 0.0,
  makeupNote: "Straight Pay (100%)",
  dutyObligation: "Standby Readiness (Pre-IAP)",
  iterationCount: 1,
  totalFlownCH: 0.0
};

function parseTimeToDec(str) {
  if (!str.includes(':')) return parseFloat(str) || 0;
  const p = str.split(':');
  return parseInt(p[0], 10) + (parseInt(p[1], 10) / 60);
}

function decToTimeStr(dec) {
  const sign = dec < 0 ? "-" : "";
  const abs = Math.abs(dec);
  const h = Math.floor(abs);
  const m = Math.round((abs - h) * 60);
  return `${sign}${h}:${m < 10 ? '0' : ''}${m}`;
}

function renderMasterScoreboard() {
  const container = document.getElementById('topMetrics');
  const m3Color = state.m3Clawback > 0 ? "var(--red)" : "var(--green-bright)";
  const m3Val = state.m3Clawback > 0 ? `-${decToTimeStr(state.m3Clawback)} CH` : "0:00 CH";

  container.innerHTML = `
    <div class="metric-box">
      <div class="metric-lbl">Current Paycheck:</div>
      <div class="metric-val" style="color: var(--blue);">${decToTimeStr(state.currentPay)} CH</div>
      <div class="metric-sub">${state.payNote}</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Sub Hours Remaining:</div>
      <div class="metric-val" style="color: var(--yellow);">${decToTimeStr(state.subRemaining)} CH</div>
      <div class="metric-sub">${state.subRemNote}</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">M+3 Paycheck Impact:</div>
      <div class="metric-val" style="color: ${m3Color};">${m3Val}</div>
      <div class="metric-sub">${state.m3Note}</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">OTP Bank:</div>
      <div class="metric-val" style="color: var(--purple-light);">${decToTimeStr(state.otpBank)} CH</div>
      <div class="metric-sub">${state.otpBankNote}</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Makeup Bank:</div>
      <div class="metric-val" style="color: var(--green-bright);">${decToTimeStr(state.makeupBank)} CH</div>
      <div class="metric-sub">${state.makeupNote}</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Duty / Work Obligation:</div>
      <div class="metric-val" style="color: #fff; font-size: 0.95rem; line-height: 1.2; margin-top: 6px;">${state.dutyObligation}</div>
      <div class="metric-sub">Operational Status</div>
    </div>
  `;
  document.getElementById('pathDisplay').innerText = `[PATH: ${state.pathCode}]`;
}

function initNavigator() {
  state.pathCode = "ROOT";
  state.origGuarDec = parseTimeToDec(document.getElementById('guarInput').value);
  state.currentPay = state.origGuarDec;
  state.payNote = "Protected @ 100%";
  state.subRemaining = state.origGuarDec;
  state.subRemNote = "Full Balance Remaining";
  state.m3Clawback = 0.0;
  state.m3Note = "No Clawback Triggered";
  state.otpBank = 0.0;
  state.otpBankNote = "125% PMU Rate";
  state.makeupBank = 0.0;
  state.makeupNote = "Straight Pay (100%)";
  state.dutyObligation = "Standby Readiness (Pre-IAP)";
  state.iterationCount = 1;
  state.totalFlownCH = 0.0;

  const isLong = document.getElementById('winType').value === 'long';
  const banner = document.getElementById('recomBanner');
  if (isLong) {
    banner.innerHTML = `💡 <strong>STRATEGIC VERDICT (Long Window &gt;72h):</strong> In a multi-day window, you are subject to daily 1000–1600 LBT availability periods. If you desire schedule freedom, electing OTP (Branch B) banks the guarantee at 125% and terminates daily contact leashes.`;
  } else {
    banner.innerHTML = `💡 <strong>STRATEGIC VERDICT (Short Window &lt;72h):</strong> Standing availability (Path A &rarr; A-A) is the dominant strategy: if CRS makes no offer during the IAP, you receive 100% of your 6:38 CH paycheck for 0.0 flight hours with zero clawback risk.`;
  }

  renderMasterScoreboard();
  renderStage1();
}

// -------------------------------------------------------------
// STAGE 1: PRE-WINDOW (A vs B)
// -------------------------------------------------------------
function renderStage1() {
  const container = document.getElementById('treeContainer');
  const winStart = document.getElementById('winStart').value;
  const guarStr = decToTimeStr(state.origGuarDec);
  const isLong = document.getElementById('winType').value === 'long';

  container.innerHTML = `
    <div class="step-card active" id="stage1Card">
      <div class="step-top">
        <span class="step-tag">LEVEL 1 // PRE-WINDOW SELECTION</span>
        <span class="step-time">NOW until ${winStart}</span>
      </div>
      <div class="step-title">Initial Strategic Selection Prior to Window Opening</div>
      <div class="banner-deadline">
        ⚠️ <strong>PILOT RESPONSE DEADLINE:</strong> If a trip is offered via VIPS prior to the IAP, you have up to 24 hours to accept or reject (cannot reject within 4 hours of showtime per Section 25.H.6.a). If contacted by telephone, the standard 15-minute callback rule applies.
      </div>
      <div class="step-text">
        Window duration is ${isLong ? '>72 hours (Multi-Day)' : '28:06 (<72h)'}. Choose your entry pathway:
      </div>

      <div class="choice-grid">
        <!-- TILE A -->
        <div class="choice-tile ${!isLong ? 'recommended-tile' : ''}">
          <div>
            ${!isLong ? '<span class="badge-rec">⭐ Recommended for &lt;72h</span>' : ''}
            <div class="choice-code">BRANCH [A]</div>
            <div class="choice-heading">Wait for IAP Window Start (Default)</div>
            <div class="choice-detail">Enter the Initial Availability Period at ${winStart}. Maintain contact readiness.</div>
            
            <div class="tile-stats-block">
              <span>Current Paycheck:</span> <strong>${guarStr} CH (100%)</strong><br>
              <span>Sub Hours Remaining:</span> <strong>${guarStr} CH</strong><br>
              <span>M+3 Paycheck Impact:</span> <strong>$0.00 (Protected)</strong><br>
              <span>OTP Bank:</span> <strong>0:00 CH</strong><br>
              <span>Makeup Bank:</span> <strong>0:00 CH</strong><br>
              <span>Duty / Work Obligation:</span> <strong>8h Phone Leash during IAP</strong>
            </div>

            <div class="pro-con-section">
              <div class="pro-block">
                <strong>Reasons this might make sense:</strong>
                • In short windows (&lt;72h): if no trip is offered during IAP, you receive ${guarStr} CH free with no further work under Sec 25.H.3.b.i.<br>
                • Preserves original trip guarantee without risking future payroll clawbacks.
              </div>
              <div class="con-block">
                <strong>Reasons to avoid:</strong>
                • Requires active phone monitoring (15-min callback rule).<br>
                • Subject to legitimate assignment offers from scheduling.
              </div>
            </div>
          </div>
          <div class="choice-actions">
            <button class="btn-choose" onclick="selectStage1('A')">Select Branch A</button>
            <a class="portal-link" href="https://pilot.fedex.com/vips/schedule" target="_blank">Schedule ↗</a>
          </div>
        </div>

        <!-- TILE B (OTP / DECLINE SUB) -->
        <div class="choice-tile ${isLong ? 'recommended-tile' : ''}">
          <div>
            ${isLong ? '<span class="badge-rec">⭐ Recommended for &gt;72h</span>' : ''}
            <div class="choice-code">BRANCH [B]</div>
            <div class="choice-heading">Decline SUB / Elect OTP</div>
            <div class="choice-detail">Drop SUB availability in VIPS; convert guarantee into OTP bank for PMU priority.</div>
            
            <div class="tile-stats-block">
              <span>Current Paycheck:</span> <strong>0:00 CH (Deferred)</strong><br>
              <span>Sub Hours Remaining:</span> <strong>0:00 CH (Closed)</strong><br>
              <span>M+3 Paycheck Impact:</span> <strong>Clawback if unworked</strong><br>
              <span>OTP Bank:</span> <strong>${guarStr} CH @ 125%</strong><br>
              <span>Makeup Bank:</span> <strong>0:00 CH</strong><br>
              <span>Duty / Work Obligation:</span> <strong>Must fly ${guarStr} CH in 4 Mo</strong>
            </div>

            <div class="pro-con-section">
              <div class="pro-block">
                <strong>Reasons this might make sense:</strong>
                • Immediate freedom: zero availability leash, phone monitoring, or scheduler calls.<br>
                • 125% pay rate on PMU trips picked up from open time.
              </div>
              <div class="con-block">
                <strong>Reasons to avoid:</strong>
                • In a &lt;72h window, staying in SUB often pays ${guarStr} CH for 0 hours flown.<br>
                • If you do not fly ${guarStr} CH within 4 months, payroll deducts the full amount at M+3.
              </div>
            </div>
          </div>
          <div class="choice-actions">
            <button class="btn-choose" onclick="selectStage1('B')">Select Branch B</button>
            <a class="portal-link" href="https://pilot.fedex.com/otp/elect" target="_blank">Decline Sub (OTP) ↗</a>
          </div>
        </div>
      </div>
      <div class="cite-text">Governed by Section 4.L.1, 4.L.2.d & 4.N (OTP 125%), and 25.H.11 (Decline SUB in VIPS).</div>
    </div>
  `;
}

function selectStage1(choice) {
  state.pathCode = choice;
  const c1 = document.getElementById('stage1Card');
  c1.className = "step-card completed";
  c1.querySelectorAll('.btn-choose').forEach(b => b.disabled = true);

  if (choice === 'B') {
    state.currentPay = 0;
    state.payNote = "0:00 Paid Now";
    state.subRemaining = 0;
    state.subRemNote = "Transferred to OTP";
    state.otpBank = state.origGuarDec;
    state.otpBankNote = "Active (Bid Month + 3)";
    state.m3Clawback = 0;
    state.m3Note = "Protected if Flown as PMU";
    state.dutyObligation = "4-Month PMU Window (125%)";
    renderMasterScoreboard();
    renderTerminalResult("[PATH: B] Declined SUB & Transferred to OTP Bank", `

function recalcLiveOffer() {
  const tripCH = parseTimeToDec(document.getElementById('liveTripCH').value);
  const isRat = document.getElementById('liveTripNature').value === 'rat';
  const guarStr = decToTimeStr(state.origGuarDec);
  
  let payDec = state.origGuarDec;
  let payLabel = guarStr + " CH";
  if (isRat) {
    const ratPay = tripCH * 1.25;
    payDec = Math.max(state.origGuarDec, ratPay);
    payLabel = `${decToTimeStr(payDec)} CH (max ${guarStr} @ 100% vs ${decToTimeStr(ratPay)} @ 125%)`;
  } else {
    payDec = Math.max(state.origGuarDec, tripCH);
    payLabel = `${decToTimeStr(payDec)} CH (max ${guarStr} vs ${decToTimeStr(tripCH)})`;
  }

  const remaining = Math.max(0, state.origGuarDec - (state.totalFlownCH + tripCH));
  const remLabel = remaining > 0 ? `${decToTimeStr(remaining)} CH (Iterates to Next Window)` : '0:00 CH (Window Closes)';

  document.getElementById('liveStatsBlock').innerHTML = `
    <span>Current Paycheck:</span> <strong>${payLabel}</strong><br>
    <span>Sub Hours Remaining:</span> <strong>${remLabel}</strong><br>
    <span>M+3 Paycheck Impact:</span> <strong>$0.00 (Protected)</strong><br>
    <span>OTP Bank:</span> <strong>0:00 CH</strong><br>
    <span>Makeup Bank:</span> <strong>0:00 CH</strong><br>
    <span>Duty / Work Obligation:</span> <strong>Fly ${document.getElementById('liveTripSpan').value}</strong>
  `;
}

function selectStage2(choice) {
  state.pathCode = choice;
  const c2 = document.getElementById('stage2Card');
  if (c2) {
    c2.className = "step-card completed";
    c2.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  const isLong = document.getElementById('winType').value === 'long';

  if (choice === 'A-A') {
    if (!isLong) {
      state.currentPay = state.origGuarDec;
      state.payNote = "100% Full Pay (0h Flown)";
      state.subRemaining = 0;
      state.subRemNote = "Window Closed Clean";
      state.m3Clawback = 0;
      state.m3Note = "Protected ($0.00 Clawback)";
      state.dutyObligation = "Released from Duty (0h)";
      renderMasterScoreboard();
      renderTerminalResult("[PATH: A-A] Short Sub Window Release - Optimal Outcome", `
        Under <strong>Section 25.H.3.b.i</strong>, because your substitution window is shorter than 72 hours (28:06), <strong>you have no further substitution responsibility after your initial availability period!</strong>
        <br><br>
        • <strong>Current Paycheck:</strong> <strong>${decToTimeStr(state.origGuarDec)} CH</strong> paid at 100% normal pay rate for 0.0 hours flown.<br>
        • <strong>Sub Hours Remaining:</strong> 0:00 CH (SUB closed).<br>
        • <strong>M+3 Paycheck Impact:</strong> <strong>$0.00 clawback</strong>. Zero future deduction.<br>
        • <strong>OTP / Makeup Bank:</strong> 0:00 CH (6:00 CH availability credit credited to Sub Guarantee Bank under Sec 4.L.3).<br>
        • <strong>Duty Obligation:</strong> Completely released from duty. No further phone monitoring required.
      `);
    } else {
      state.currentPay = 18.0;
      state.payNote = "18:00 CH Buyout (Sec 4.L.1)";
      state.subRemaining = Math.max(0, state.origGuarDec - 18.0);
      state.subRemNote = "Balance Eligible for OTP";
      state.m3Clawback = 0;
      state.m3Note = "Protected ($0.00 Clawback)";
      state.dutyObligation = "72h Assignment Freeze";
      renderMasterScoreboard();
      renderTerminalResult("[PATH: A-A] Long Window Buyout - 18:00 CH Credited", `
        Under Section 4.L.1 and 25.H.3.b.ii, because your window exceeds 72 hours and no trip was assigned during the IAP:
        <br><br>
        • <strong>Buyout Paid:</strong> <strong>18:00 CH</strong> credited toward your trip guarantee.<br>
        • <strong>72-Hour Freeze:</strong> No substitution assignment can begin within 72 hours of your original showtime.<br>
        • <strong>Remaining Balance:</strong> ${decToTimeStr(state.subRemaining)} CH. You may elect OTP for the balance or remain in SUB for subsequent 1000–1600 LBT windows.<br>
        • <strong>Action Link:</strong> Submit election via <a href="https://pilot.fedex.com/otp/elect" target="_blank" style="color: var(--blue);">OTP Election Desk</a> before 0900 LBT tomorrow.
      `);
    }
  } else if (choice === 'A-B-Accept') {
    const tripCHDec = parseTimeToDec(document.getElementById('liveTripCH').value);
    const tripID = document.getElementById('liveTripID').value;
    const isRat = document.getElementById('liveTripNature').value === 'rat';
    
    state.totalFlownCH += tripCHDec;
    const effectiveTripPay = isRat ? (tripCHDec * 1.25) : tripCHDec;
    state.currentPay = Math.max(state.origGuarDec, state.totalFlownCH);
    state.payNote = isRat ? "Includes 125% RAT Multiplier" : "Protected Guarantee";
    
    const rem = Math.max(0, state.origGuarDec - state.totalFlownCH);
    state.subRemaining = rem;
    state.subRemNote = rem > 0 ? "Residual Balance" : "Satisfied (Closed)";
    state.m3Clawback = 0;
    state.m3Note = "Protected ($0.00 Clawback)";
    state.dutyObligation = `Completed ${tripID}`;
    renderMasterScoreboard();

    if (rem > 0) {
      // ITERATIVE PATH: Balance remains! Loop to next availability window
      renderIterativeStage(tripID, tripCHDec);
    } else {
      // Balance satisfied; window closes under Sec 25.H.4.a
      renderStage3("A-B-Accept");
    }
  } else if (choice === 'A-B-Decline') {
    state.currentPay = state.origGuarDec;
    state.subRemaining = state.origGuarDec;
    state.subRemNote = "SUB Leash Continues";
    state.m3Clawback = 0;
    state.m3Note = "Protected ($0.00 Clawback)";
    state.dutyObligation = "Active Availability Leash";
    renderMasterScoreboard();
    renderTerminalResult("[PATH: A-B-Decline] Contract Protected Decline", `
      Under Section 25.H.6.c / 25.H.5.b, declining a Reassignment Trip (RAT) or an incompatible day/night assignment does <strong>not</strong> forfeit your original trip guarantee.
      <br><br>
      • <strong>Current Paycheck:</strong> ${decToTimeStr(state.origGuarDec)} CH protected.<br>
      • <strong>Sub Hours Remaining:</strong> ${decToTimeStr(state.origGuarDec)} CH (remain in SUB status).<br>
      • <strong>M+3 Paycheck Impact:</strong> $0.00 clawback.<br>
      • <strong>Duty Obligation:</strong> Remain available for legitimate offers until IAP concludes.
    `);
  } else if (choice === 'A-C') {
    state.currentPay = state.origGuarDec;
    state.subRemaining = 0;
    state.subRemNote = "Covered by Standby Credit";
    state.m3Clawback = 0;
    state.m3Note = "Protected ($0.00 Clawback)";
    state.dutyObligation = "Released after 4h Hold";
    renderMasterScoreboard();
    renderTerminalResult("[PATH: A-C] Airport Hold / Base Standby Completed", `
      Under Section 4.L.4 / 4.O.2, you completed base standby or were held 4 hours without blockout.
      <br><br>
      • <strong>Current Paycheck:</strong> <strong>${decToTimeStr(state.origGuarDec)} CH</strong> original guarantee paid.<br>
      • <strong>Sub Hours Remaining:</strong> 0:00 CH (satisfied via 6:00 CH standby credit).<br>
      • <strong>M+3 Paycheck Impact:</strong> $0.00 clawback.<br>
      • <strong>Action Link:</strong> Verify duty hours on your <a href="https://pilot.fedex.com/crewpay" target="_blank" style="color: var(--blue);">Crew Pay Sheet</a>.
    `);
  } else if (choice === 'A-D') {
    state.currentPay = 0;
    state.payNote = "Guarantee Forfeited";
    state.subRemaining = 0;
    state.subRemNote = "Forfeited";
    state.makeupBank = state.origGuarDec;
    state.makeupNote = "Straight Pay (100%)";
    state.m3Clawback = state.origGuarDec;
    state.m3Note = `Clawback at M+3 if ${decToTimeStr(state.origGuarDec)} unworked`;
    state.dutyObligation = "Must fly makeup";
    renderMasterScoreboard();
    renderTerminalResult("[PATH: A-D] Assignment Refusal (Forfeited Guarantee)", `
      Under Section 4.L.2.b, refusing a valid substitution assignment or missing the 15-minute callback forfeits your original trip guarantee.
      <br><br>
      • <strong>Current Paycheck:</strong> 0:00 CH.<br>
      • <strong>Sub Hours Remaining:</strong> 0:00 CH.<br>
      • <strong>Makeup Bank:</strong> <strong>${decToTimeStr(state.origGuarDec)} CH</strong> make-up eligible under Section 4.L.5.<br>
      • <strong>M+3 Paycheck Impact:</strong> Full <strong>-${decToTimeStr(state.origGuarDec)} CH clawback</strong> executed at Month+3 unless recovered through open time make-up.<br>
      • <strong>Action Link:</strong> Submit for make-up flying via the <a href="https://pilot.fedex.com/vips/makeup-bidding" target="_blank" style="color: var(--blue);">VIPS Make-Up Board</a>.
    `);
  }
}

              • Accrues 6:00 CH credit toward satisfying remaining guarantee without flying.<br>
              • If credit satisfies remaining balance, SUB window terminates under Sec 25.H.4.a.
            </div>
            <div class="con-block">
              <strong>Reasons to avoid:</strong>
              • Must remain available between 1000 and 1600 LBT.
            </div>
          </div>
        </div>
        <div class="choice-actions">
          <button class="btn-choose" onclick="selectIterNoOffer(${iterNum})">Complete Window (No Offer)</button>
          <a class="portal-link" href="https://pilot.fedex.com/crs/release" target="_blank">Log Release ↗</a>
        </div>
      </div>

      <!-- TILE 3: ELECT OTP FOR RESIDUAL -->
      <div class="choice-tile">
        <div>
          <div class="choice-code">BRANCH [${state.pathCode}-OTP]</div>
          <div class="choice-heading">Elect OTP for Remaining Balance</div>
          <div class="choice-detail">Cut the cord on SUB leashes; transfer remaining ${remStr} CH into OTP bank.</div>
          
          <div class="tile-stats-block">
            <span>Current Paycheck:</span> <strong>${decToTimeStr(state.totalFlownCH)} CH Flown Pay</strong><br>
            <span>Sub Hours Remaining:</span> <strong>0:00 CH (Closed)</strong><br>
            <span>M+3 Paycheck Impact:</span> <strong>Clawback if unworked</strong><br>
            <span>OTP Bank:</span> <strong>${remStr} CH @ 125%</strong><br>
            <span>Makeup Bank:</span> <strong>0:00 CH</strong><br>
            <span>Duty / Work Obligation:</span> <strong>Must fly ${remStr} CH in 4 Mo</strong>
          </div>

          <div class="pro-con-section">
            <div class="pro-block">
              <strong>Reasons this might make sense:</strong>
              • Terminates daily 1000–1600 LBT availability windows immediately.<br>
              • Allows you to pick up open time you prefer at 125% pay rate.
            </div>
            <div class="con-block">
              <strong>Reasons to avoid:</strong>
              • If remaining hours are not flown within 4 months, payroll deducts the unworked balance at M+3.
            </div>
          </div>
        </div>
        <div class="choice-actions">
          <button class="btn-choose" onclick="selectIterOTP(${iterNum})">Elect OTP for Balance</button>
          <a class="portal-link" href="https://pilot.fedex.com/otp/elect" target="_blank">Elect OTP ↗</a>
        </div>
      </div>
    </div>
    <div class="cite-text">Governed by Section 4.L.2.d, 4.L.3 (6 CH credit), 25.H.3.c (Subsequent windows), and 25.H.4.a (Close of SUB window).</div>
  `;
  container.appendChild(div);
}

function selectIterTrip(iterNum, didAccept) {
  const card = document.getElementById(`iterStageCard_${iterNum}`);
  card.className = "step-card completed";
  card.querySelectorAll('button').forEach(b => b.disabled = true);

  if (didAccept) {
    const tripCH = parseTimeToDec(document.getElementById(`iterTripCH_${iterNum}`).value);
    const tripID = document.getElementById(`iterTripID_${iterNum}`).value;
    state.totalFlownCH += tripCH;
    state.currentPay = Math.max(state.origGuarDec, state.totalFlownCH);
    
    const rem = Math.max(0, state.origGuarDec - state.totalFlownCH);
    state.subRemaining = rem;
    state.subRemNote = rem > 0 ? "Residual Balance" : "Satisfied (Closed)";
    state.dutyObligation = `Completed ${tripID}`;
    state.pathCode += `-T${iterNum}`;
    renderMasterScoreboard();

    if (rem > 0) {
      renderIterativeStage(tripID, tripCH);
    } else {
      renderStage3(`Iter-${iterNum}`);
    }
  } else {
    state.pathCode += `-Dec${iterNum}`;
    renderMasterScoreboard();
    renderTerminalResult(`[PATH: ${state.pathCode}] Declined Trip #${iterNum} (Contract Protected)`, `
      Under Section 25.H.6.c / 25.H.5.b, declining a Reassignment Trip (RAT) or an incompatible day/night assignment does <strong>not</strong> forfeit your original trip guarantee.
      <br><br>
      • <strong>Current Paycheck:</strong> ${decToTimeStr(state.currentPay)} CH protected.<br>
      • <strong>Sub Hours Remaining:</strong> ${decToTimeStr(state.subRemaining)} CH (remain in SUB status).<br>
      • <strong>Duty Obligation:</strong> Remain available for legitimate offers in the next 1000–1600 LBT window.
    `);
  }
}

function selectIterNoOffer(iterNum) {
  const card = document.getElementById(`iterStageCard_${iterNum}`);
  card.className = "step-card completed";
  card.querySelectorAll('button').forEach(b => b.disabled = true);

  state.subRemaining = Math.max(0, state.subRemaining - 6.0);
  state.subRemNote = state.subRemaining === 0 ? "Satisfied by Credit" : "Residual Balance";
  state.dutyObligation = state.subRemaining === 0 ? "Released from SUB" : "Next 1000-1600 Window";
  state.pathCode += `-NoOffer${iterNum}`;
  renderMasterScoreboard();

  if (state.subRemaining > 0) {
    renderIterativeStage("No Offer (+6h Credit)", 6.0);
  } else {
    renderTerminalResult(`[PATH: ${state.pathCode}] SUB Window Closed Clean by Credit Accrual`, `
      Under Section 4.L.3 and Section 25.H.4.a, your accumulated credits now equal or exceed your original trip guarantee!
      <br><br>
      • <strong>Final Paycheck Compensation:</strong> <strong>${decToTimeStr(state.currentPay)} CH</strong> fully protected.<br>
      • <strong>Sub Hours Remaining:</strong> 0:00 CH (Window officially closed).<br>
      • <strong>M+3 Paycheck Impact:</strong> $0.00 clawback.<br>
      • <strong>Duty Obligation:</strong> Completely released from duty. No further contact required.
    `);
  }
}

function selectIterOTP(iterNum) {
  const card = document.getElementById(`iterStageCard_${iterNum}`);
  card.className = "step-card completed";
  card.querySelectorAll('button').forEach(b => b.disabled = true);

  const rem = state.subRemaining;
  state.subRemaining = 0;
  state.subRemNote = "Closed";
  state.otpBank = rem;
  state.otpBankNote = "Active (Bid Month + 3)";
  state.dutyObligation = `Must fly ${decToTimeStr(rem)} CH PMU`;
  state.pathCode += `-OTP${iterNum}`;
  renderMasterScoreboard();
  renderTerminalResult(`[PATH: ${state.pathCode}] Residual Transferred to OTP Bank`, `
    Under Section 4.L.2.d, your remaining balance of <strong>${decToTimeStr(rem)} CH</strong> has been transferred into OTP status.
    <br><br>
    • <strong>Paycheck Earnings:</strong> Paid for flown hours (${decToTimeStr(state.totalFlownCH)} CH).<br>
    • <strong>OTP Bank:</strong> <strong>${decToTimeStr(rem)} CH</strong> eligible to pick up open time at <strong>125% of normal pay rate</strong>.<br>
    • <strong>M+3 Status:</strong> Protected for 4 months. Unworked hours will be deducted at Month+3.<br>
    • <strong>Action Link:</strong> Search trips on the <a href="https://pilot.fedex.com/pmu" target="_blank" style="color: var(--blue);">PMU Open Time Board</a>.
  `);
}

// -------------------------------------------------------------
// STAGE 3: POST-FLIGHT & OPERATIONAL OVERAGE AUDIT
// -------------------------------------------------------------
function renderStage3(sourceTag) {
  const container = document.getElementById('treeContainer');
  const div = document.createElement('div');
  div.className = "step-card active";
  div.id = "stage3Card";
  div.innerHTML = `
    <div class="step-top">
      <span class="step-tag">LEVEL 3 // OPERATIONAL OVERAGE AUDIT</span>
      <span class="step-time">Post-Trip Release</span>
    </div>
    <div class="step-title">Section 4.BB.9 Operational Extension Reconciliation</div>
    <div class="banner-deadline">
      ⚠️ <strong>AUDIT DEADLINE:</strong> Verify actual block-in and release time with Duty Officer before closing your docket if delayed past scheduled base return.
    </div>
    <div class="step-text">
      Evaluate actual trip termination against scheduled release into base rest:
    </div>

    <div class="choice-grid">
      <!-- ON TIME / <=2H -->
      <div class="choice-tile">
        <div>
          <div class="choice-code">BRANCH [${state.pathCode}-A]</div>
          <div class="choice-heading">On-Time / Extension ≤ 2 Hours</div>
          <div class="choice-detail">Trip completes on time or within 2h past scheduled base release.</div>
          
          <div class="tile-stats-block">
            <span>Current Paycheck:</span> <strong>${decToTimeStr(state.currentPay)} CH (100%)</strong><br>
            <span>Sub Hours Remaining:</span> <strong>0:00 CH (Complete)</strong><br>
            <span>M+3 Paycheck Impact:</span> <strong>$0.00 (Protected)</strong><br>
            <span>OTP Bank:</span> <strong>0:00 CH</strong><br>
            <span>Makeup Bank:</span> <strong>0:00 CH</strong><br>
            <span>Duty / Work Obligation:</span> <strong>Completed (Released)</strong>
          </div>

          <div class="pro-con-section">
            <div class="pro-block">
              <strong>Reasons this might make sense:</strong>
              • Standard clean settlement: minor overages absorbed into guarantee at 100% under Sec 4.BB.9.a.<br>
              • Zero payroll clawback.
            </div>
            <div class="con-block">
              <strong>Reasons to avoid:</strong>
              • Standard operational reality.
            </div>
          </div>
        </div>
        <div class="choice-actions">
          <button class="btn-choose" onclick="selectStage3('${state.pathCode}-A')">Select Path ${state.pathCode}-A</button>
          <a class="portal-link" href="https://pilot.fedex.com/flitedeck" target="_blank">FliteDeck Close ↗</a>
        </div>
      </div>

      <!-- OVERRUN > 2H -->
      <div class="choice-tile">
        <div>
          <div class="choice-code">BRANCH [${state.pathCode}-B]</div>
          <div class="choice-heading">Operational Overrun &gt; 2 Hours</div>
          <div class="choice-detail">Extended &gt;2h beyond scheduled base release into scheduled base rest.</div>
          
          <div class="tile-stats-block">
            <span>Current Paycheck:</span> <strong>Trip Pay + 150% Overrun Rate</strong><br>
            <span>Sub Hours Remaining:</span> <strong>0:00 CH (Complete)</strong><br>
            <span>M+3 Paycheck Impact:</span> <strong>$0.00 (Protected)</strong><br>
            <span>OTP Bank:</span> <strong>0:00 CH</strong><br>
            <span>Makeup Bank:</span> <strong>0:00 CH</strong><br>
            <span>Duty / Work Obligation:</span> <strong>Extended Duty Flown</strong>
          </div>

          <div class="pro-con-section">
            <div class="pro-block">
              <strong>Reasons this might make sense:</strong>
              • Overrun past scheduled release paid at <strong>150% premium rate</strong> via trip rig (Sec 4.BB.9.b.ii).<br>
              • Additional compensation reflected immediately on current pay voucher.
            </div>
            <div class="con-block">
              <strong>Reasons to avoid:</strong>
              • Extended duty, acute circadian fatigue, and loss of scheduled base rest.
            </div>
          </div>
        </div>
        <div class="choice-actions">
          <button class="btn-choose" onclick="selectStage3('${state.pathCode}-B')">Select Path ${state.pathCode}-B</button>
          <a class="portal-link" href="https://pilot.fedex.com/overage-claim" target="_blank">Insite Paylog ↗</a>
        </div>
      </div>
    </div>
    <div class="cite-text">Governed by Section 4.BB.9.a (&le;2h at 100%) and Section 4.BB.9.b.ii (&gt;2h at 150% pay rate).</div>
  </div>
  `;
  container.appendChild(div);
}

function selectStage3(choice) {
  state.pathCode = choice;
  const c3 = document.getElementById('stage3Card');
  if (c3) {
    c3.className = "step-card completed";
    c3.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  if (choice.endsWith('-A')) {
    state.dutyObligation = "Completed / Off Duty";
    renderMasterScoreboard();
    renderTerminalResult(`[PATH: ${choice}] Flight Complete - Clean Settlement`, `
      Trip completed on schedule or within 2 hours of scheduled base release.
      <br><br>
      • <strong>Current Paycheck:</strong> <strong>${decToTimeStr(state.currentPay)} CH</strong>.<br>
      • <strong>Sub Hours Remaining:</strong> 0:00 CH.<br>
      • <strong>M+3 Paycheck Impact:</strong> $0.00 clawback.<br>
      • <strong>Section 4.BB.9.a:</strong> Minor overrun was absorbed into guarantee at 100%.
    `);
  } else {
    const overrunPremium = 1.0 * 1.5; // Example 1h overrun at 150%
    state.currentPay += overrunPremium;
    state.payNote = "Includes 150% Section 4.BB.9 Overage";
    state.dutyObligation = "Completed / Off Duty";
    renderMasterScoreboard();
    renderTerminalResult(`[PATH: ${choice}] Flight Complete - 150% Overrun Rate Applied`, `
      Trip extended more than 2 hours beyond scheduled base termination under Section 4.BB.9.b:
      <br><br>
      • <strong>Scheduled Release:</strong> Credited at 100% toward trip guarantee.<br>
      • <strong>Overrun Beyond Scheduled Release:</strong> Compensated at <strong>150% of normal pay rate</strong> calculated via trip rig.<br>
      • <strong>Current Paycheck:</strong> Updated to <strong>${decToTimeStr(state.currentPay)} CH</strong>.<br>
      • <strong>Action Link:</strong> Submit an online paylog ticket via <a href="https://pilot.fedex.com/insite" target="_blank" style="color: var(--blue);">Insite Paylog Request</a>.
    `);
  }
}

function renderTerminalResult(pathLabel, htmlContent) {
  const container = document.getElementById('treeContainer');
  const div = document.createElement('div');
  div.className = "card";
  div.style.borderColor = "var(--green-bright)";
  div.style.background = "#11181c";
  div.innerHTML = `
    <h2 style="color: var(--green-bright); border-bottom-color: rgba(35, 134, 54, 0.4);">
      Final Settlement Summary // ${pathLabel}
    </h2>
    <div style="font-size: 0.92rem; line-height: 1.6; color: var(--text);">
      ${htmlContent}
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);">
      <span style="font-size: 0.8rem; color: var(--text-muted); font-family: monospace;">Sequence Code: ${pathLabel}</span>
      <button class="btn-restart" onclick="initNavigator()">Test Another Decision Path</button>
    </div>
  `;
  container.appendChild(div);
}

window.onload = initNavigator;
</script>
